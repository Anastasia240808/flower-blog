services:
    web:
        build: .
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            - ./apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
        depends_on:
            - db
        environment:
            APACHE_DOCUMENT_ROOT: /var/www/html/public
            DB_HOST: db
            DB_NAME: blog_db
            DB_USER: user
            DB_PASS: password
        # Smarty должен уметь писать в папки compiled и cache
        command: >
            bash -c "mkdir -p src/templates/compiled src/templates/cache
            && chmod -R 777 src/templates/compiled src/templates/cache
            && apache2-foreground"

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: blog_db
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
